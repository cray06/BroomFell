    <ellipse cx="56" cy="61" rx="3.8" ry="5.2" fill="#253047" stroke="none"/>
    <ellipse cx="74" cy="61" rx="3.8" ry="5.2" fill="#253047" stroke="none"/>
    <circle cx="57.4" cy="59" r="1.6" fill="#FFFFFF" stroke="none"/>
    <circle cx="75.4" cy="59" r="1.6" fill="#FFFFFF" stroke="none"/>
